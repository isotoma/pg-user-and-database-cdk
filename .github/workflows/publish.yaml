name: Node.js Package
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    # Setup .npmrc file to publish to npm
    - uses: actions/setup-node@v1
      with:
        node-version: '16.x'
        registry-url: 'https://registry.npmjs.org'
    # Matches test.yaml: the same npm, and npm ci rather than npm install, so
    # the published artefact is built from the locked dependency tree rather
    # than whatever happens to resolve at publish time.
    - run: npm i -g npm@9
    - run: npm ci
    - run: npm run compile
    - run: cd build && npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - run: npm run docs
    - name: Deploy docs
      uses: JamesIves/github-pages-deploy-action@4.1.5
      with:
        branch: gh-pages
        folder: docs
